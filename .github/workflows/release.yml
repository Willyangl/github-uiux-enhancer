name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update manifest version
        run: |
          jq --arg ver "${{ steps.version.outputs.VERSION }}" \
            '.version = $ver' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          echo "manifest.json version updated to ${{ steps.version.outputs.VERSION }}"
          cat manifest.json | head -5

      - name: Create ZIP package
        run: |
          mkdir -p dist
          zip -r "dist/github-uiux-enhancer-${{ steps.version.outputs.VERSION }}.zip" \
            manifest.json \
            content.js \
            background.js \
            popup.html \
            popup.js \
            styles.css \
            i18n.js \
            i18n/ \
            _locales/ \
            icons/icon16.png \
            icons/icon48.png \
            icons/icon128.png \
            icons/icon300.png
          echo "Package contents:"
          unzip -l "dist/github-uiux-enhancer-${{ steps.version.outputs.VERSION }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "GitHub UI/UX Enhancer v${{ steps.version.outputs.VERSION }}"
          body: |
            ## GitHub UI/UX Enhancer v${{ steps.version.outputs.VERSION }}

            ### Installation
            1. Download `github-uiux-enhancer-${{ steps.version.outputs.VERSION }}.zip`
            2. Chrome: `chrome://extensions/` → Developer mode → Load unpacked
            3. Edge: `edge://extensions/` → Developer mode → Load unpacked

            ### Chrome Web Store
            Available on the Chrome Web Store (update may take a few hours to be reviewed).
          files: dist/github-uiux-enhancer-${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false

      - name: Publish to Chrome Web Store
        run: |
          npm install -g chrome-webstore-upload-cli
          chrome-webstore-upload upload --source "dist/github-uiux-enhancer-${{ steps.version.outputs.VERSION }}.zip"
          chrome-webstore-upload publish
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Publish to Edge Add-ons
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: dist/github-uiux-enhancer-${{ steps.version.outputs.VERSION }}.zip
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}
